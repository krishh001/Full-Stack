<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EventListeners</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div>
      <button id="ShowAssignmentNotification">
        Show Assignment Notification
      </button>
      <p id="AssignmentNotification">
        <!-- Your Assignment is approaching! -->
      </p>
      <button id="ShowAttendenceNotification">
        Show Attendence Notification
      </button>
      <p id="AttendenceNotification">
        <!-- Please check your attendence status! -->
      </p>
      <button id="StopAssignmentNotification">
        Stop Assignment Notification
      </button>
    </div>

    <hr>
    <hr>
    <hr>

    <!-- Event Bubbeling -->
    <section id="EventBubbling">
        <div id="outer">
            This is outer div
            <div id="inner">
                This is inner div
            </div>
        </div>
    </section>

    <br><br>
    <!-- EventCapturing -->

    <section id="EventCapturing">
        <div>Krishna Verma</div>
        <div>JNCT</div>
        <div>CSE</div>
        <div>3rd Year</div>
        <button id="view">View more</button>
    </section>

    <!-- EventDelegation -->

    <section id="EventDelegation">
      <div>Stundet 1</div>
      <div>Stundet 2</div>
      <div>Stundet 3</div>
      <div>Stundet 4</div>
      <div>Stundet 5</div>
    </section>

    <script src="./script.js"></script>
  </body>
</html>
