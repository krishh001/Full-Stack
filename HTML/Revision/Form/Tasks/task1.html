<body>

    <fieldset align="center">
      <h4>Admin Login Page</h4>
      <form>
        <label for="username">Username : </label>
        <input
          type="text"
          name="username"
          id="username"
          placeholder="Enter Your Username"

        <label for="password">Password : </label>
        <input
          type="password"
          name="password"
          id="password"
          placeholder="Enter Your Password"
        />
        <br /><br />
        <button>Submit</button>
        <button>Reset</button>
      </form>
    </fieldset>
