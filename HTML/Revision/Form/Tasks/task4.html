<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 4</title>
</head>
<body>
    <h2 align="center">TASK4</h2>
    <hr />
    <table border="1" align="center">
      <tr>
        <th colspan="4"><b>Registration Form</b></th>
      </tr>
      <tr>
        <td width="177">Student Name</td>
        <td><input type="text" name="name" id="name" placeholder="First Name"></td>
        <td><input type="text" name="name" id="name" placeholder="Middle Name"></td>
        <td><input type="text" name="name" id="name" placeholder="Last Name"></td>
      </tr>
      <tr>
        <td width="177">Father's Name</td>
        <td><input type="text" name="fname" id="fname" placeholder="Enyer Your Father's Name"></td>
        <td width="177">Mother's Name</td>
        <td><input type="text" name="mname" id="mname" placeholder="Enter Your Mother's Name"></td>
      </tr>
      <tr>
        <td width="177">Date of Birth</td>
        <td><input type="date" name="dob" id="dob"></td>
        <td width="177">Gender</td>
        <td><input type="radio" name="female" id="male" value="male">
        <span>Male</span>
        <input type="radio" name="female" id="female" value="female">
        <span>Female</span></td>
      </tr>
      <tr>
        <td width="177">Category</td>
        <td><input type="radio" name="catagory" id="gen" value="gen">
          <span>GEN</span>
          <input type="radio" name="catagory" id="obc" value="obc">
          <span>OBC</span>
          <input type="radio" name="catagory" id="scst" value="scst">
          <span>SC/ST</span></td>
          <td  width="177">Handicapped</td>
        <td>
          <input type="radio" name="handi" id="yes" value="yes">
          <span>Yes</span>
          <input type="radio" name="handi" id="no" value="no">
          <span>No</span>
        </td>
      </tr>
      <tr>
        <td width="177">Ex-Serviceman</td>
        <td>
          <input type="radio" name="ex" id="yes" value="yes">
          <span>Yes</span>
          <input type="radio" name="ex" id="no" value="no">
          <span>No</span>
        </td>
        <td width="177">EWS</td>
        <td>
          <input type="radio" name="ews" id="yes" value="yes">
          <span>Yes</span>
          <input type="radio" name="ews" id="no" value="no">
          <span>No</span>
        </td>
      </tr>
      <tr>
        <td width="177"><label for="email">Email ID</label></td>
        <td><input type="email" name="email" id="email"></td>
        <td width="177"><label for="mob">Mobile No.</label></td>
        <td><input type="number" name="mob" id="mob"></td>
      </tr>
      <tr>
        <td width="177"><label for="state">State</label></td>
        <td>
          <select name="state" id="state">
            <option value="">Select any One</option>
            <option value="Bihar">Bihar</option>
            <option value="MP">Madhya Pradesh</option>
            <option value="UP">Uttar Pradesh</option>
            <option value="Maharashtra">Maharashtra</option>
          </select>
        </td>
        <td width="177"><label for="city">City</label></td>
        <td>
          <select name="city" id="city">
            <option value="">Select any One</option>
            <option value="Bhopal">Bhopal</option>
            <option value="Nagpur">Nagpur</option>
            <option value="Patna">Patna</option>
            <option value="Mumbai">Mumbai</option>
          </select>
        </td>
      </tr>
      <tr>
        <td width="177"><label for="photo">Upload Photo</label></td>
        <td><input type="file" name="photo" id="photo"></td>
        <td width="177"><label for="sign">Upload Signature</label></td>
        <td><input type="file" name="sign" id="sign"></td>
      </tr>
      <tr>
        <td colspan="4" align="center"><button>Submit</button></td>
      </tr>
    </table>
    <a href="../formindex.html""><button>Back</button></a>
</body>
</html>
