<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <h2 align="center">TASK1</h2>
    <fieldset align="center">
        <h4>Admin Login Page</h4>
        <form>
        <label for="username">Username : </label>
        <input type="text" name="username" id="username" placeholder="Enter Your Username">
        <br><br>
        <label for="password">Password : </label>
        <input type="password" name="password" id="password" placeholder="Enter Your Password">
        <br><br>
        <button>Submit</button>
        <button>Reset</button>
    </form>
    </fieldset>
    <hr>
    <h2 align="center">TASK2</h2>
    <hr>
    <fieldset>
        <h4>Pizza Order Form</h4>
    <table>
        <tr>
            <td><label for="firstname">First Name : </label></td>
           <td><input type="text" name="firstname" id="firstname"></td>
        </tr>
        <tr>
            <td><label for="lastname">Last Name : </label></td>
            <td><input type="text" name="lastname" id="lastname"></td>
        </tr>
        <tr>
            <td><label for="email">Email : </label></td>
            <td><input type="email" name="email" id="email"></td>
        </tr>
        <tr>
            <td><label for="number">Contact Number : </label></td>
            <td><input type="number" name="number" id="number"></td>
        </tr>
        <tr>
            <td><label for="date">Preferred Delivery Date: </label></td>
            <td><input type="date" name="date" id="date"></td>
        </tr>
    </table>
    <br>
    <label for="size">Size : </label>
    <br>
    <input type="radio" name="small" id="small" value="small">
    <span>Small</span>
    <input type="radio" name="med" id="med" value="med">
    <span>Medium</span>
    <input type="radio" name="large" id="large" value="large">
    <span>Large</span>
    <br><br>
    <label for="flavor">Flavor : </label>
    <br>
    <input type="checkbox" name="H" id="H" value="H">
    <span>Hawaiian (Php 150.00) </span>
    <select name="quantity" id="quantity">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
    </select>
    <br>
    <input type="checkbox" name="P" id="P" value="P">
    <span>Pepperoni (Php 140.00) </span>
    <select name="quantity" id="quantity">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
    </select>
    <br>
    <input type="checkbox" name="V" id="V" value="V">
    <span>Vegetable (Php 130.00) </span>
    <select name="quantity" id="quantity">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
    </select>
    <br><br>
    <table>
       <tr>
         <td><label for="Cnumber">Credit Card Number : </label></td>
         <td><input type="number" name="Cnumber" id="Cnumber"></td>
       </tr>
        <tr>
         <td><label for="pin">PIN : </label></td>
        <td><input type="number" name="pin" id="pin"></td>
        </tr>
    </table>
    <label for="note">Additional Note : </label>
    <br>
    <textarea name="note" id="note"></textarea>
    <br>
    <button>Submit</button>
    </fieldset>
</body>
</html>
